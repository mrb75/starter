[package]
name = "base"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
env_logger = "0.11.10"
log = "0.4.29"
tokio = { version="1.52.2", features=["full"] }
anyhow = "1.0"

feature_rocket = {path = "../feature_rocket", optional=true}
feature_nextjs = {path = "../feature_nextjs", optional=true}
shared = {path = "../shared"}



[features]
rocket = ["dep:feature_rocket"]
nextjs = ["dep:feature_nextjs"]
